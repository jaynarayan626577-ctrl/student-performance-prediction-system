{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow"><h1>{{ title }}</h1>
<form method="post" class="grid-form">
<label>Name<input name="name" value="{{ student.name if student else '' }}" required></label>
<label>Attendance (%)<input type="number" name="attendance" min="0" max="100" step="0.1" value="{{ student.attendance if student else '' }}" required></label>
<label>Assignment (%)<input type="number" name="assignment" min="0" max="100" step="0.1" value="{{ student.assignment if student else '' }}" required></label>
<label>Internal Marks (%)<input type="number" name="internal_marks" min="0" max="100" step="0.1" value="{{ student.internal_marks if student else '' }}" required></label>
<label>Previous Marks (%)<input type="number" name="previous_marks" min="0" max="100" step="0.1" value="{{ student.previous_marks if student else '' }}" required></label>
<label>Study Hours / Day<input type="number" name="study_hours" min="0" max="24" step="0.5" value="{{ student.study_hours if student else '' }}" required></label>
<label>Actual Final Marks (optional)<input type="number" name="final_marks" min="0" max="100" step="0.1" value="{{ student.final_marks if student and student.final_marks is not none else '' }}"></label>
<div class="full"><button>💾 Save Student</button></div>
</form></div>
{% endblock %}
